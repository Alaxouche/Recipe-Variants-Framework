; RecipeVariantsFramework
;
; Rewritten on every launch: missing keys are added back with their defaults and
; comments, so deleting this file is a safe way to reset it.
;
; Group configs do not go here: each mod ships its own JSON in
; Data/SKSE/Plugins/RecipeVariantsFramework/.

[General]

;Master switch. Set to false and no item is ever swapped.
Enabled = true

[Recipes]

;Hide the copies of a recipe that only differ by which variant they ask for
;(one copy per apple, per tomato...), keeping one that asks for the base item.
;Done in memory at startup; the plugins on disk are not changed.
MergeDuplicates = true

;Also fold the copies that only differ by which variant they make (a
;cutting recipe per half model), keeping the one that makes the base item.
;The other models then no longer come out of that recipe.
MergeVariantResults = true

[Log]

;trace, debug, info, warn, error, critical or off.
;debug lists every variant of every group at startup.
Level = info
